<!doctype html>
<!-- Placeholder phone page of M2-1. The real game page is M4's work. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çılgın Kurye</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 16px; }
  input, button { font-size: 18px; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  #teams button { width: 24%; }
  #status { margin-top: 12px; font-weight: bold; }
</style>
<script src="/vendor/msgpack.js"></script>
</head>
<body>
<h1>Çılgın Kurye</h1>
<label>Game code <input id="code" inputmode="numeric" maxlength="6"></label>
<label>Name <input id="name" maxlength="24"></label>
<button id="join">Join</button>
<div id="teams" hidden>
  <p>Choose a team:</p>
  <button data-team="0">0</button><button data-team="1">1</button><button data-team="2">2</button><button data-team="3">3</button>
</div>
<div id="status"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // The random player key stays in this browser, so a reload gives the same player.
  let key = store.get("playerKey");
  if (!key) {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    key = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
    store.set("playerKey", key);
  }

  const fromUrl = new URLSearchParams(location.search).get("code");
  $("code").value = fromUrl || store.get("code") || "";
  $("name").value = store.get("name") || "";

  let ws = null;
  function connect() {
    const code = $("code").value.trim();
    const name = $("name").value.trim();
    store.set("code", code);
    store.set("name", name);
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => ws.send(MessagePack.encode({ t: "hello", key, name, code }));
    ws.onmessage = (e) => {
      const m = MessagePack.decode(new Uint8Array(e.data));
      if (m.t === "welcome") {
        store.set("joined", "1");
        $("status").textContent = `Player ${m.player}` + (m.returning ? " (back again)" : "");
        $("teams").hidden = false;
      } else if (m.t === "error") {
        $("status").textContent = `Not joined: ${m.reason}`;
      }
    };
    ws.onclose = (e) => {
      if (e.code === 4002) $("status").textContent = "This player was opened on another page.";
      else if (e.code !== 4003) $("status").textContent += " · link lost";
    };
  }

  $("join").onclick = connect;
  for (const b of document.querySelectorAll("#teams button")) {
    b.onclick = () => ws && ws.send(MessagePack.encode({ t: "join", team: Number(b.dataset.team) }));
  }
  if (store.get("joined") === "1" && $("code").value) connect();
</script>
</body>
</html>
