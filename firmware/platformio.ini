; Çılgın Kurye board firmware (M7 + M8)
;
;   pio run -e esp32dev            build for the board
;   pio run -e esp32dev -t upload  flash over USB
;   pio test -e native             run unit tests on the PC (no hardware)

[platformio]
default_envs = esp32dev

[env]
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -Wall

[env:esp32dev]
; Arduino-ESP32 3.x through the pioarduino platform (see M7 proposal, Section 5.2).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
test_ignore = *

[env:native]
; PC build of the portable code (M8 engine, protocol, hit detection maths).
platform = native
test_framework = unity
build_src_filter = -<*>
