name: firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", "contracts/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "contracts/**", ".github/workflows/firmware.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build ESP32 firmware
        run: pio run -d firmware -e esp32dev
      - name: Unit tests on the PC (native)
        run: pio test -d firmware -e native
