<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9fdcff" />
    <title>Çılgın Kurye · 3D city</title>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div class="hud speed"><span id="kmh">0</span><small>km/h</small></div>

    <div class="hud tools">
      <button class="btn tool" data-key="c" title="Camera (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="btn tool on" data-key="n" title="Cars (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-4l2-5h12l2 5v4z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>
      </button>
      <button class="btn tool" data-key="r" title="Restart (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 1 0 2-5"/><path d="M5 4v4h4"/></svg>
      </button>
      <button class="btn tool" data-key="p" title="Pause (P)">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      </button>
    </div>
    <div class="hud fps" id="fps"></div>

    <div class="hud steer">
      <button class="btn round" data-hold="arrowleft" aria-label="Left">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 4.5 7 12l8.5 7.5z"/></svg>
      </button>
      <button class="btn round" data-hold="arrowright" aria-label="Right">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 4.5 17 12l-8.5 7.5z"/></svg>
      </button>
    </div>

    <div class="hud pedals">
      <button class="btn brake" data-hold="arrowdown" aria-label="Brake">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button class="btn gas" data-hold="arrowup" aria-label="Gas">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 18 12 6l7 12z"/></svg>
      </button>
    </div>

    <div class="hud paused" id="paused">PAUSED</div>

    <script type="module" src="./drive.ts"></script>
  </body>
</html>
