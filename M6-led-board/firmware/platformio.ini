; Board program for the ESP32 (M6).
;   pio run                  build
;   pio run -t upload        build and load it onto the board (USB cable)
;   pio device monitor       serial output
; The PC tests do not need PlatformIO: see src/link/README.md.

[env:esp32dev]
; Fixed version: everybody in M6 builds with the same Arduino core (3.3.12).
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 3 MB for the program instead of 1.25 MB (no over-the-air update; we load over USB).
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
