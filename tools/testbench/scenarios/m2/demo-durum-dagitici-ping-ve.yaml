# An existing demo or test, run as a command. From #108 (Muhib).
module: M2
title: Durum dağıtıcı, ping ve metrikler (M2-3)
run:
  cwd: M2-network
  cmd: npm run demo:broadcast
install:
  - M2-network
needs:
  - M2-network/src/demo-broadcast.ts
files:
  - M2-network/src/demo-broadcast.ts
  - M2-network/test/fakes/fakeM1.ts
  - M2-network/test/fakes/botPhone.ts
fake: Sahte M1 oyun durumu üretiyor, 8 bot telefon dinliyor (10 s).
result: Her bot her tick'in durumunu alıyor, kayıp yok; ping ve kare hızı ölçülüyor.
params: { demo_seconds: 10, ping_delay_ms: 0 }
edit:
  - { name: demo_seconds, type: slider, label: "Süre (s)", min: 5, max: 60, step: 5 }
  - { name: ping_delay_ms, type: slider, label: "Ping cevabına eklenen gecikme (ms)", min: 0, max: 500, step: 10 }
env: { DEMO_SECONDS: demo_seconds, PING_DELAY_MS: ping_delay_ms }   # read by src/demo-broadcast.ts
