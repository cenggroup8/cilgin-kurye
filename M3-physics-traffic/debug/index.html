<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M3 test page</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: rgba(16, 18, 24, 0.78);
        --line: rgba(255, 255, 255, 0.08);
        --text: #eceff4;
        --dim: #8b93a5;
        --accent: #5fe3a8;
        --warn: #ffb44c;
        --water: #6cc4ff;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas#view { display: block; width: 100vw; height: 100vh; }
      .panel {
        position: fixed;
        background: var(--panel);
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      }
      .num { font-variant-numeric: tabular-nums; }
      .cap { color: var(--dim); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; }

      #dash { top: 16px; left: 16px; width: 264px; padding: 14px 18px 16px; }
      .gauge { position: relative; height: 118px; margin: 0 -4px; }
      .gauge svg { width: 100%; height: 100%; overflow: visible; }
      .gauge .track { stroke: rgba(255, 255, 255, 0.07); }
      .gauge .fill { stroke: var(--accent); transition: stroke 0.2s; }
      .gauge.sliding .fill { stroke: var(--warn); }
      .gauge .mark { fill: var(--text); }
      .readout { position: absolute; inset: 40px 0 0; text-align: center; }
      .readout b { display: block; font-size: 42px; font-weight: 650; letter-spacing: -1.5px; line-height: 1; }
      .readout span { display: block; margin-top: 4px; }

      .chips { display: flex; gap: 6px; justify-content: center; margin: 2px 0 6px; min-height: 22px; }
      .chip {
        padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
        background: rgba(255, 255, 255, 0.07); color: var(--dim);
      }
      .chip.road { color: var(--accent); background: rgba(95, 227, 168, 0.12); }
      .chip.puddle { color: var(--water); background: rgba(108, 196, 255, 0.14); }
      .chip.quake { color: var(--danger); background: rgba(255, 107, 107, 0.14); }
      .chip.slide { color: #1a1206; background: var(--warn); display: none; }
      #dash.sliding .chip.slide { display: inline-block; animation: blink 0.5s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.55; } }

      .row { display: grid; grid-template-columns: 52px 1fr 54px; align-items: center; gap: 10px; margin-top: 9px; }
      .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.07); position: relative; overflow: hidden; }
      .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
      .bar.mid::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, 0.3); }
      .bar.warn i { background: var(--warn); }
      .val { text-align: right; font-size: 12px; }

      #params { top: 16px; right: 16px; width: 232px; padding: 12px 16px 10px; }
      .param { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
      .param:first-of-type { border-top: 0; }
      .param .name { flex: 1; color: var(--dim); }
      .param .v { font-weight: 600; min-width: 54px; text-align: right; }
      .param .v.off { color: var(--dim); font-weight: 400; }
      .param .v.on { color: var(--danger); }
      .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }

      kbd {
        display: inline-block; min-width: 18px; padding: 1px 5px; text-align: center;
        font: 600 10.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text);
        background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);
        border-bottom-width: 2px; border-radius: 5px;
      }

      #keys {
        bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 18px; padding: 9px 16px; color: var(--dim); font-size: 12px; white-space: nowrap;
      }
      #keys span { display: inline-flex; gap: 4px; align-items: center; }

      #mini { right: 16px; bottom: 16px; width: 176px; height: 176px; padding: 8px; transition: opacity 0.3s; }
      #mini canvas { width: 100%; height: 100%; display: block; }
      #mini.hidden { opacity: 0; pointer-events: none; }

      #pause {
        top: 18px; left: 50%; transform: translateX(-50%);
        padding: 6px 14px; font-weight: 700; letter-spacing: 0.18em; font-size: 11px;
        color: var(--warn); display: none;
      }
      #pause.show { display: block; }

      @media (max-width: 900px) { #keys { display: none; } }
      @media (max-width: 760px) {
        #params { top: auto; bottom: 16px; left: 16px; right: auto; width: 210px; }
        #dash { width: 220px; }
        #mini { width: 128px; height: 128px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="dash" class="panel">
      <div class="gauge" id="gauge">
        <svg viewBox="0 0 220 118">
          <path class="track" d="M 59.8 101 A 58 58 0 1 1 160.2 101" fill="none" stroke-width="9" stroke-linecap="round" pathLength="100" />
          <path class="fill" id="gauge-fill" d="M 59.8 101 A 58 58 0 1 1 160.2 101" fill="none" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" />
          <circle class="mark" id="gauge-mark" r="3.2" cx="110" cy="14" />
        </svg>
        <div class="readout">
          <b class="num" id="kmh">0</b>
          <span class="cap"><span class="num" id="mps" style="display:inline">0.0</span> m/s</span>
        </div>
      </div>
      <div class="chips">
        <span class="chip road" id="ground">road</span>
        <span class="chip slide">sliding</span>
      </div>
      <div class="row"><span class="cap">Lean</span><div class="bar mid"><i id="lean-bar"></i></div><span class="val num" id="lean">0°</span></div>
      <div class="row"><span class="cap">Slide</span><div class="bar warn"><i id="slip-bar" style="left:0"></i></div><span class="val num" id="slip">0.00</span></div>
      <div class="row"><span class="cap">Grip</span><div class="bar"><i id="grip-bar" style="left:0"></i></div><span class="val num" id="grip">1.00</span></div>
      <div class="row"><span class="cap">Heading</span><div></div><span class="val num" id="heading">0°</span></div>
    </div>

    <div id="params" class="panel">
      <div class="head"><span class="cap">Parameters</span><span class="cap num" id="tick">tick 0</span></div>
      <div class="param"><span class="name">Top speed</span><kbd>1</kbd><kbd>2</kbd><span class="v num" id="p-top"></span></div>
      <div class="param"><span class="name">Road grip</span><kbd>3</kbd><kbd>4</kbd><span class="v num" id="p-grip"></span></div>
      <div class="param"><span class="name">Speed factor</span><kbd>5</kbd><kbd>6</kbd><span class="v num" id="p-factor"></span></div>
      <div class="param"><span class="name">Earthquake</span><kbd>Q</kbd><span class="v" id="p-quake"></span></div>
      <div class="param"><span class="name">NPC cars</span><kbd>N</kbd><span class="v num" id="p-cars"></span></div>
      <div class="param"><span class="name">Camera</span><kbd>C</kbd><span class="v" id="p-cam"></span></div>
    </div>

    <div id="keys" class="panel">
      <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> drive</span>
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> also</span>
      <span><kbd>+</kbd><kbd>−</kbd> zoom</span>
      <span><kbd>F</kbd> fall</span>
      <span><kbd>R</kbd> restart</span>
      <span><kbd>P</kbd> pause</span>
    </div>

    <div id="mini" class="panel"><canvas id="mini-canvas"></canvas></div>
    <div id="pause" class="panel">PAUSED</div>

    <script type="module" src="./drive.ts"></script>
  </body>
</html>
