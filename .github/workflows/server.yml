name: server

# Runs once the server stack is chosen and server/package.json exists.
on:
  push:
    branches: [main]
    paths: ["server/**", "client/**", "admin/**", "contracts/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "client/**", "admin/**", "contracts/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a Node project
        id: node
        run: test -f server/package.json && echo "found=true" >> "$GITHUB_OUTPUT" || echo "No server/package.json yet; skipping."
      - uses: actions/setup-node@v4
        if: steps.node.outputs.found == 'true'
        with:
          node-version: "22"
      - if: steps.node.outputs.found == 'true'
        run: npm ci --prefix server && npm test --prefix server
