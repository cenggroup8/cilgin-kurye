; Board program for the ESP32 (M6).
;   pio run                  build
;   pio run -t upload        build and load it onto the board (USB cable)
;   pio device monitor       serial output
; The PC tests do not need PlatformIO: see src/link/README.md.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
